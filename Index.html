<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f0d05">
<title>Griha Pravesham Invitation</title>
<style>
:root{--H:600px;--k:1;--tx:0px;--ko:1}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{height:100dvh;background:radial-gradient(circle at 50% 40%,#5a2d12,#1f0d05 80%);overflow:hidden;font-family:Georgia,serif;user-select:none;-webkit-user-select:none}
.scene{perspective:2400px;display:flex;align-items:center;justify-content:center;width:100%;height:100%;touch-action:pan-y;overflow:hidden}
.stage{position:relative;flex:none;height:var(--H);width:calc(var(--H)*.6667);transform-style:preserve-3d;transform:translateX(0) scale(var(--k));transition:transform 1.8s cubic-bezier(.6,.05,.2,1) .9s;cursor:pointer}
.open .stage{transform:translateX(var(--tx)) scale(var(--ko));cursor:default}
.ready .stage{transition:transform .7s cubic-bezier(.3,.7,.2,1) 0s}
.panel{position:absolute;top:0;height:100%;inset:0;width:100%;box-shadow:0 10px 40px rgba(0,0,0,.55);background:#fff8dc}
.panel img{width:100%;height:100%;object-fit:cover;display:block;-webkit-user-drag:none}
.leaf{position:absolute;top:0;width:calc(var(--H)*.3333);height:100%;transform-style:preserve-3d;transition:transform 2.2s cubic-bezier(.55,.05,.2,1) .3s,width 2.2s cubic-bezier(.55,.05,.2,1) .3s;z-index:5}
.open .leaf{width:calc(var(--H)*.459)}
.leaf.l{left:0;transform-origin:left center}
.leaf.r{right:0;transform-origin:right center}
.leaf>div{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden}
.front img{position:absolute;top:0;height:100%;width:calc(var(--H)*.6667);max-width:none;-webkit-user-drag:none}
.leaf.l .front img{left:0}.leaf.r .front img{right:0;left:auto}
.back{background:#fff8dc;transform:rotateY(180deg);box-shadow:0 10px 40px rgba(0,0,0,.55)}
.back img{width:100%;height:100%;object-fit:cover;display:block;-webkit-user-drag:none}
.open .leaf.l{transform:rotateY(-180deg)}
.open .leaf.r{transform:rotateY(180deg)}
.hint{position:fixed;bottom:calc(4vh + env(safe-area-inset-bottom));left:0;right:0;text-align:center;color:#f6d98a;letter-spacing:.15em;font-size:14px;animation:p 1.8s infinite;transition:opacity .5s;pointer-events:none}
@keyframes p{50%{opacity:.35}}
.open .hint{opacity:0;animation:none}
.topbtn{position:fixed;top:max(12px,env(safe-area-inset-top));right:14px;background:#f6d98a;color:#4a1d0a;border:0;border-radius:20px;padding:8px 16px;font:600 14px Georgia,serif;opacity:0;pointer-events:none;transition:opacity .5s;cursor:pointer;z-index:9}
.ready .topbtn{opacity:1;pointer-events:auto}
.nav{position:fixed;bottom:calc(14px + env(safe-area-inset-bottom));left:0;right:0;display:none;align-items:center;justify-content:center;gap:18px;opacity:0;pointer-events:none;transition:opacity .5s;z-index:9}
.narrow.ready .nav{display:flex;opacity:1;pointer-events:auto}
.nav button{width:44px;height:44px;border-radius:50%;border:0;background:rgba(246,217,138,.92);color:#4a1d0a;font-size:22px;cursor:pointer}
.nav button:disabled{opacity:.35}
.dots{display:flex;gap:10px}
.dots i{width:9px;height:9px;border-radius:50%;background:rgba(246,217,138,.4);transition:all .3s}
.dots i.on{background:#f6d98a;transform:scale(1.35)}
.allbtn{width:auto!important;border-radius:22px!important;padding:0 16px;font:600 14px Georgia,serif!important}
.tip{position:fixed;bottom:calc(74px + env(safe-area-inset-bottom));left:0;right:0;text-align:center;color:#f6d98a;letter-spacing:.12em;font-size:12px;opacity:0;pointer-events:none;transition:opacity .4s;z-index:9}
.narrow.ready.ov .tip{opacity:.9}
@media(prefers-reduced-motion:reduce){*{transition-duration:.01s!important;transition-delay:0s!important}}
</style></head><body>
<div class="scene" id="scene"><div class="stage" id="stage">
 <div class="panel center"><img src="center.jpeg" alt="Griha Pravesham invitation"></div>
 <div class="leaf l"><div class="front"><img src="door.jpeg" alt="Entrance door"></div><div class="back"><img src="left.jpeg" alt="Location QR and address"></div></div>
 <div class="leaf r"><div class="front"><img src="door.jpeg" alt=""></div><div class="back"><img src="right.jpeg" alt="With love, Rajaram and family"></div></div>
</div></div>
<div class="hint">TAP THE DOOR TO OPEN</div>
<button class="topbtn" id="re">Replay</button>
<div class="nav"><button id="pv" aria-label="Previous">&#8249;</button><div class="dots"><i></i><i class="on"></i><i></i></div><button id="nx" aria-label="Next">&#8250;</button><button id="all" class="allbtn">All</button></div>
<div class="tip">TAP A SHEET TO ZOOM IN</div>
<script>
const b=document.body,rt=document.documentElement,dots=[...document.querySelectorAll('.dots i')],pv=document.getElementById('pv'),nx=document.getElementById('nx');
let pos=-1,narrow=false,H=600,timer;
function fit(){
 const w=innerWidth,h=innerHeight;narrow=w/h<1.25;let k=1;
 if(narrow){H=Math.min(h*.82,w*.94/.6667)}
 else{H=Math.min(h*.88,w*.96/1.585);k=Math.min(Math.min(h*.9,w*.9/.6667)/H,3)}
 rt.style.setProperty('--H',H+'px');rt.style.setProperty('--k',k);
 b.classList.toggle('narrow',narrow);focus();
}
function focus(){
 let tx=0,ko=1;
 if(narrow){
  if(pos===-1){ko=innerWidth*.96/(1.585*H);}
  else if(pos!==1){
   ko=Math.min(innerHeight*.86/H,innerWidth*.94/(.459*H));
   tx=(pos===0?1:-1)*.5625*H*ko;
  }
 }
 b.classList.toggle('ov',narrow&&pos===-1);
 rt.style.setProperty('--tx',tx+'px');rt.style.setProperty('--ko',ko);
 dots.forEach((d,i)=>d.classList.toggle('on',i===pos));
 pv.disabled=pos===0;nx.disabled=pos===2;
}
function go(d){if(!b.classList.contains('open')||!narrow)return;pos=pos===-1?(d>0?0:2):Math.max(0,Math.min(2,pos+d));focus()}
function openIt(){
 if(b.classList.contains('open'))return;
 b.classList.add('open');clearTimeout(timer);timer=setTimeout(()=>b.classList.add('ready'),3600);
}
function replay(){clearTimeout(timer);b.classList.remove('ready','open');pos=-1;focus()}
document.getElementById('stage').addEventListener('click',e=>{
 if(!b.classList.contains('open')){openIt();return}
 if(narrow&&pos===-1&&b.classList.contains('ready')){
  const r=e.currentTarget.getBoundingClientRect();
  pos=e.clientX<r.left?0:e.clientX>r.right?2:1;focus();
 }
});
document.getElementById('all').onclick=()=>{pos=-1;focus()};
document.getElementById('re').addEventListener('click',replay);
pv.onclick=()=>go(-1);nx.onclick=()=>go(1);
addEventListener('keydown',e=>{if(e.key==='ArrowRight')go(1);if(e.key==='ArrowLeft')go(-1);if(e.key==='Enter'||e.key===' ')openIt()});
let sx=null;const sc=document.getElementById('scene');
sc.addEventListener('pointerdown',e=>{sx=e.clientX});
sc.addEventListener('pointerup',e=>{if(sx===null)return;const dx=e.clientX-sx;sx=null;if(Math.abs(dx)>40&&pos!==-1)go(dx<0?1:-1)});
sc.addEventListener('pointercancel',()=>{sx=null});
fit();addEventListener('resize',fit);
</script></body></html>
